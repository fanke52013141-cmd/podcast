<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日志 · AI 播客</title>
<link rel="stylesheet" href="/static/style.css?v=0.7">
<link rel="stylesheet" href="/static/duo.css?v=0.7">
<link rel="stylesheet" href="/static/final.css?v=0.7">
<style>
/* 日志页 · 浅色暖纸风（与全站统一） */
body{background:var(--bg);color:var(--txt)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.lbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.lbar select,.lbar input{background:#fff;border:1px solid var(--line2);color:var(--txt);
  border-radius:8px;padding:8px 12px;font:inherit;font-size:13px}
.lbar input{flex:1;min-width:160px}
.lbar input:focus{border-color:#171717;outline:none}
.lbar .ghost{background:#fff;border:1px solid var(--line2);color:var(--txt);
  border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;font-size:13px}
.lbar .ghost:hover{background:var(--surface2);border-color:#858078}
.lv{display:inline-block;min-width:58px;text-align:center;border-radius:6px;
  padding:2px 8px;font-size:11px;font-weight:600}
.lv.ERROR{background:#FFF0EF;color:#B23B3B}
.lv.WARNING{background:#FFF5D9;color:#80570C}
.lv.INFO{background:#EDF4FF;color:#315F9E}
.lv.DEBUG{background:var(--surface2);color:#676D76}
.lrow{display:flex;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);
  font-family:'JetBrains Mono',Consolas,monospace;font-size:12.5px;line-height:1.6;
  cursor:pointer}
.lrow:hover{background:var(--surface2)}
.lrow .ts{color:#A3A3A3;flex:none;width:148px}
.lrow .src{color:#315F9E;flex:none;width:86px;overflow:hidden;text-overflow:ellipsis}
.lrow .ev{color:#B45309;flex:none;width:170px;overflow:hidden;text-overflow:ellipsis}
.lrow .msg{flex:1;word-break:break-all;color:var(--txt)}
.lrow .rid{color:#276B4C;flex:none;width:92px}
.lrow.open .ctx{display:block}
.ctx{display:none;white-space:pre-wrap;background:var(--surface2);border-radius:8px;
  padding:10px 14px;margin:8px 0 2px;color:#676D76;font-size:12px}
.exc{color:#B23B3B;white-space:pre-wrap;font-size:11.5px;margin-top:6px;display:block}
.lhead{display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;
  background:var(--card);z-index:2}
.lhead-title{color:#676D76;font-size:12px;letter-spacing:.04em}
.lfiles{display:flex;gap:8px}
.lchip{font-size:11px;color:#676D76;background:var(--surface2);border:1px solid var(--line);
  border-radius:999px;padding:3px 10px}
.lchip b{color:var(--txt);font-weight:500}
.empty{color:#676D76;text-align:center;padding:40px 0}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">AI 播客</div>
  <nav>
    <a href="/?v=0.7">工作台</a>
    <a href="/voices?v=0.7">音色库</a>
    <a href="/tasks?v=0.7">任务中心</a>
    <a href="/settings?v=0.7">设置</a>
    <a class="active" href="/logs?v=0.7">日志</a>
  </nav>
</header>

<main style="max-width:1280px;margin:0 auto;padding:20px 28px">
  <div class="lbar">
    <select id="fSource"><option value="all">全部来源</option><option value="webapp">webapp</option><option value="tts">tts</option></select>
    <select id="fLevel"><option value="">全部级别</option><option>ERROR</option><option>WARNING</option><option>INFO</option><option>DEBUG</option></select>
    <input id="fQ" placeholder="搜索关键字（错误信息 / 路径 / 引擎名…）">
    <input id="fRid" placeholder="request_id" style="max-width:150px">
    <input id="fJid" placeholder="job_id" style="max-width:200px">
    <button class="ghost" id="btnRefresh">刷新</button>
    <button class="ghost" id="btnAuto">自动 5s: 关</button>
    <select id="fLimit"><option>200</option><option selected>500</option><option>1000</option></select>
  </div>
  <section class="card" style="min-height:300px;max-height:calc(100vh - 210px);overflow:auto;padding:0">
    <div class="lhead">
      <span class="lhead-title">系统日志 · 实时排障</span>
      <span class="lfiles" id="fileChips"></span>
    </div>
    <div id="list"><div class="empty">加载中…</div></div>
  </section>
</main>
<script src="/static/logs.js?v=0.7"></script>
</body>
</html>
