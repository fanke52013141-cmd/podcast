<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务中心 · AI 播客</title>
<link rel="stylesheet" href="/static/style.css?v=0.20">
<link rel="stylesheet" href="/static/duo.css?v=0.20">
<link rel="stylesheet" href="/static/final.css?v=0.20">
<link rel="stylesheet" href="/static/dropdown.css?v=0.20">
<script src="/static/dropdown.js?v=0.20" defer></script>
<link rel="stylesheet" href="/static/warm.css?v=0.20">
<script src="/static/creator.js?v=0.20" defer></script>
</head>
<body>
<header class="topbar">
  <div class="logo">AI 播客</div>
  <nav>
    <a href="/">工作台</a>
    <a href="/voices?v=0.20">音色库</a>
    <a class="active" href="/tasks?v=0.20">任务中心</a>
    <a href="/settings?v=0.20">设置</a>
    <a href="/logs?v=0.20">日志</a>
  </nav>
</header>

<main class="twrap">
  <div class="thead">
    <h2>任务中心</h2>
    <div class="filters" id="filters">
      <button class="ghost on" data-f="all">全部</button>
      <button class="ghost" data-f="active">进行中</button>
      <button class="ghost" data-f="script_ready">脚本就绪</button>
      <button class="ghost" data-f="done">已完成</button>
      <button class="ghost" data-f="failed">失败</button>
    </div>
    <span class="mono small" id="sum"></span>
  </div>
  <div id="list" class="tasklist"><div class="empty">加载中…</div></div>
</main>
<div id="toast" class="toast" hidden></div>
<script src="/static/tasks.js?v=0.20"></script>
</body>
</html>
