<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务中心 · AI 播客工坊</title>
<link rel="stylesheet" href="/static/style.css?v=0.2">
</head>
<body>
<header class="topbar">
  <div class="logo"><span class="wave">▮▮▮</span> AI 播客工坊</div>
  <nav>
    <a href="/">工作台</a>
    <a href="/voices">音色库</a>
    <a class="active" href="/tasks">任务中心</a>
    <a href="/settings">设置</a>
  </nav>
  <div class="user">Studio</div>
</header>

<main class="twrap">
  <div class="thead">
    <h2>任务中心</h2>
    <div class="filters" id="filters">
      <button class="ghost on" data-f="all">全部</button>
      <button class="ghost" data-f="active">进行中</button>
      <button class="ghost" data-f="script_ready">脚本就绪</button>
      <button class="ghost" data-f="done">已完成</button>
      <button class="ghost" data-f="failed">失败</button>
    </div>
    <span class="mono small" id="sum"></span>
  </div>
  <div id="list" class="tasklist"><div class="empty">加载中…</div></div>
</main>
<div id="toast" class="toast" hidden></div>
<script src="/static/tasks.js?v=0.2"></script>
</body>
</html>
