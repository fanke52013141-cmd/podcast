<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音色库 · AI 播客</title>
<link rel="stylesheet" href="/static/style.css?v=0.20">
<link rel="stylesheet" href="/static/duo.css?v=0.20">
<link rel="stylesheet" href="/static/final.css?v=0.20">
<link rel="stylesheet" href="/static/dropdown.css?v=0.20">
<script src="/static/dropdown.js?v=0.20" defer></script>
<link rel="stylesheet" href="/static/warm.css?v=0.20">
<script src="/static/creator.js?v=0.20" defer></script>
</head>
<body>
<header class="topbar">
  <div class="logo">AI 播客</div>
  <nav>
    <a href="/">工作台</a>
    <a class="active" href="/voices?v=0.20">音色库</a>
    <a href="/tasks?v=0.20">任务中心</a>
    <a href="/settings?v=0.20">设置</a>
    <a href="/logs?v=0.20">日志</a>
  </nav>
</header>

<main class="vwrap">
  <div class="vhero">
    <h1>音色库</h1>
  </div>

  <section class="card vsearch">
    <input id="q" placeholder="描述你要的声音，例如：温暖低沉的男声">
    <button class="ghost" id="btnNewVoice">＋ 新建音色</button>
    <button class="primary" id="btnDesign">AI 设计新音色</button>
  </section>

  <section class="vgrid" id="grid"></section>
</main>

<audio id="player" preload="none" hidden></audio>

<dialog id="designDlg" style="max-width:520px;width:92vw">
  <div class="dlg-head"><h3>AI 设计新音色</h3>
    <button class="ghost" onclick="document.getElementById('designDlg').close()">关闭</button></div>
  <div class="field-label">音色描述（越具体越好：性别/年龄/语速/风格/适用节目）</div>
  <textarea id="dgPrompt" rows="3" placeholder="例：温柔知性的年轻女声，语速偏慢，吐字清晰温润，适合深夜电台"></textarea>
  <div class="field-label" style="margin-top:8px">试听文本（用这段话试听效果）</div>
  <textarea id="dgPreview" rows="2">夜色渐深，欢迎回到我们的节目，今晚我们慢慢聊。</textarea>
  <div class="frow" style="margin-top:8px">
    <div><div class="field-label">音色名称</div><input id="dgDName" placeholder="深夜知性·女"></div>
    <div><div class="field-label">性别</div>
      <select id="dgDGender"><option value="female">女</option><option value="male">男</option></select></div>
  </div>
  <div class="small" style="color:#676D76;line-height:1.7">提示：描述越具体效果越稳（性别 / 年龄 / 语速 / 风格 / 适用的节目场景）。MiniMax 设计 + 自动转正为长期音色，全程约 25 秒，成本几分钱。</div>
  <div class="actionbar" style="position:static;margin-top:12px">
    <span></span><button class="primary" id="dgDesignGo">开始设计</button></div>
</dialog>
<dialog id="editDlg">
  <div class="dlg-head"><h3 id="dgTitle">编辑音色</h3>
    <button class="ghost" onclick="document.getElementById('editDlg').close()">关闭</button></div>
  <div class="frow"><div><div class="field-label">名称</div><input id="dgName"></div>
    <div><div class="field-label">音色 ID（只读）</div><input id="dgId" readonly class="mono"></div></div>
  <div class="frow"><div><div class="field-label">性别</div>
      <select id="dgGender"><option value="female">女</option><option value="male">男</option></select></div>
    <div><div class="field-label">年龄段</div><input id="dgAge" placeholder="26-32"></div>
    <div><div class="field-label">语速感</div>
      <select id="dgSpeed"><option value="slow">慢</option><option value="normal">正常</option><option value="fast">快</option></select></div></div>
  <div class="frow"><div class="grow"><div class="field-label">风格标签（逗号分隔）</div>
      <input id="dgTags" placeholder="温暖, 亲切, 深夜电台"></div></div>
  <div class="frow"><div><div class="field-label">人物绑定名</div><input id="dgPersona" placeholder="主持人小雅"></div>
    <div><div class="field-label">授权状态</div>
      <select id="dgLicense"><option value="authorized">授权</option><option value="public">公开</option><option value="generated">AI生成</option></select></div>
    <div><div class="field-label">来源</div>
      <select id="dgSource"><option value="self_recorded">自录</option><option value="public">公开素材</option><option value="voicegen">AI造音</option></select></div></div>
  <div class="field-label">参考音频转写（克隆必需，逐字）</div>
  <textarea id="dgPromptText" rows="2" placeholder="参考音频里的每一个字…"></textarea>
  <div class="field-label" style="margin-top:10px">参考音频（<b>10-14 秒最优，15 秒硬上限</b>，wav/mp3；单人、无噪音、风格匹配节目）</div>
  <div class="frow" style="margin-top:6px">
    <div class="grow"><input type="file" id="dgAudio" accept=".wav,.mp3,.m4a"></div>
    <div style="align-self:flex-end"><button class="ghost" id="dgUpload">上传</button></div>
  </div>
  <div class="actionbar" style="position:static;margin-top:14px">
    <button class="ghost" id="dgDelete" style="color:var(--red)">删除音色</button>
    <div><button class="primary" id="dgSave">保存</button></div>
  </div>
</dialog>

<div id="toast" class="toast" hidden></div>
<script src="/static/voices.js?v=0.20"></script>
</body>
</html>
